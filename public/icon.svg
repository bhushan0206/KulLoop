<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" />

  <!-- Sacred Loop (Concentric orbital tithi cycle) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="8 12" opacity="0.35" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.25" />

  <!-- Diya base (Traditional earthen lamp) -->
  <g transform="translate(0, 20)">
    <!-- Diya bowl -->
    <path d="M140 295 C140 375, 372 375, 372 295 C372 280, 140 280, 140 295 Z" fill="url(#gold)" />
    <ellipse cx="256" cy="295" rx="116" ry="24" fill="#78350f" opacity="0.8" />
    <ellipse cx="256" cy="293" rx="104" ry="18" fill="#451a03" />

    <!-- Radiant Glow behind Flame -->
    <circle cx="256" cy="210" r="70" fill="#f59e0b" opacity="0.2" filter="url(#glow)" />

    <!-- Flame -->
    <path d="M256 120 C230 180, 215 220, 215 260 C215 285, 233 300, 256 300 C279 300, 297 285, 297 260 C297 220, 282 180, 256 120 Z" fill="url(#flame)" filter="url(#glow)" />
    <!-- Inner bright core of flame -->
    <path d="M256 185 C244 220, 236 245, 236 265 C236 278, 245 286, 256 286 C267 286, 276 278, 276 265 C276 245, 268 220, 256 185 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Small star / tithi indicators on the cycle ring -->
  <circle cx="256" cy="86" r="6" fill="#fde68a" />
  <circle cx="396" cy="186" r="5" fill="#fde68a" opacity="0.8" />
  <circle cx="396" cy="326" r="5" fill="#fde68a" opacity="0.8" />
  <circle cx="256" cy="426" r="6" fill="#fde68a" />
  <circle cx="116" cy="326" r="5" fill="#fde68a" opacity="0.8" />
  <circle cx="116" cy="186" r="5" fill="#fde68a" opacity="0.8" />
</svg>
